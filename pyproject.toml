[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-data-pipeline"
version = "0.1.0"
description = "Learning project for a mock banking transaction data pipeline"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
pipeline = [
    "pandas>=2.2,<4.0",
    "pyodbc>=5.1,<6.0",
    "python-dotenv>=1.0,<2.0",
]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
